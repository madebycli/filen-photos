name: "Filen SDK auto-release"

# Weekly: if Filen published a newer official SDK release (filen-rs tag filen-js@X.Y.Z), bump the pinned
# submodule on a branch, analyze + test + build the Android APK on that branch, and ONLY if all of that
# passes merge it into main and publish a GitHub pre-release with the signed APK.
# If anything fails, nothing is merged or released; a draft PR is left for a human instead.
#
# Repository variable FILEN_AUTO_MERGE=false turns the automatic merge + release off (draft PR only).
# Ente upstream is never merged automatically.

# Filen fork: no automatic triggers; run it by hand ("Run workflow"). The original triggers are commented out below.
on:
    # schedule:
    #     - cron: "17 4 * * 1"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write
    actions: write

concurrency:
    group: filen-sdk-update
    cancel-in-progress: false

jobs:
    bump:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.bump.outputs.changed }}
            old: ${{ steps.bump.outputs.old }}
            new: ${{ steps.bump.outputs.new }}
            branch: ${{ steps.bump.outputs.branch }}
            old_toolchain: ${{ steps.bump.outputs.old_toolchain }}
            new_toolchain: ${{ steps.bump.outputs.new_toolchain }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Bump submodule to the newest Filen release
              id: bump
              run: |
                  set -euo pipefail
                  old="$(tr -d '[:space:]' < filen/FILEN_VERSION)"
                  old_commit="$(git rev-parse HEAD:filen/filen-rs)"
                  new="$(filen/scripts/update-filen-rs.sh)"
                  if [[ -z "$new" ]]; then
                      echo "Already on the newest Filen release ($old)"
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  branch="filen-update/${new#filen-js@}"
                  if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
                      echo "Branch $branch already exists (a previous run did not finish); leaving it to a human"
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  git -C filen/filen-rs fetch --quiet --depth 1 origin "$old_commit" || true
                  old_tc="$(git -C filen/filen-rs show "$old_commit:rust-toolchain.toml" 2>/dev/null | sed -n 's/^channel *= *"\(.*\)"/\1/p' || true)"
                  new_tc="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' filen/filen-rs/rust-toolchain.toml)"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -b "$branch"
                  git add filen/filen-rs filen/FILEN_VERSION
                  git commit -m "Update Filen SDK to $new"
                  git push origin "$branch"
                  {
                      echo "changed=true"
                      echo "old=$old"
                      echo "new=$new"
                      echo "branch=$branch"
                      echo "old_toolchain=${old_tc:-unknown}"
                      echo "new_toolchain=$new_tc"
                  } >> "$GITHUB_OUTPUT"

    verify:
        needs: bump
        if: needs.bump.outputs.changed == 'true'
        uses: ./.github/workflows/filen-android.yml
        with:
            ref: ${{ needs.bump.outputs.branch }}
            build_apk: true
        secrets: inherit

    release:
        needs: [bump, verify]
        if: needs.bump.outputs.changed == 'true' && vars.FILEN_AUTO_MERGE != 'false'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: filen-photos-test-apk
                  path: artifacts

            - name: Fast-forward main to the verified update
              env:
                  BRANCH: ${{ needs.bump.outputs.branch }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout main
                  git merge --ff-only "origin/${BRANCH}"
                  git push origin main
                  git push origin --delete "${BRANCH}"

            - name: Publish GitHub pre-release
              env:
                  GH_TOKEN: ${{ github.token }}
                  OLD: ${{ needs.bump.outputs.old }}
                  NEW: ${{ needs.bump.outputs.new }}
                  OLD_TC: ${{ needs.bump.outputs.old_toolchain }}
                  NEW_TC: ${{ needs.bump.outputs.new_toolchain }}
              run: |
                  set -euo pipefail
                  tag="sdk-${NEW#filen-js@}"
                  if gh release view "$tag" >/dev/null 2>&1; then tag="${tag}-$(git rev-parse --short HEAD)"; fi
                  cat > notes.md <<NOTES
                  Automatic weekly release: official Filen SDK \`${OLD}\` -> \`${NEW}\`.

                  - Upstream changes: https://github.com/FilenCloudDienste/filen-rs/compare/${OLD}...${NEW}
                  - Rust toolchain: \`${OLD_TC}\` -> \`${NEW_TC}\`
                  - Analysis, unit tests and the arm64 APK build passed. CI does **not** log in to a live Filen
                    account, so this is published as a **pre-release**; verify login, browsing and uploads on a phone.
                  - Install \`filen-photos-*.apk\` (arm64-v8a only). SHA-256 sums are in \`SHA256SUMS\`.
                  NOTES
                  gh release create "$tag" artifacts/* --target "$(git rev-parse HEAD)" \
                      --prerelease --latest=false \
                      --title "Filen SDK ${NEW#filen-js@} ($(date -u +%F))" --notes-file notes.md

    draft-pr:
        # Fallback: auto-merge disabled, or verification failed. Leaves the branch for a human.
        needs: [bump, verify, release]
        if: always() && needs.bump.outputs.changed == 'true' && (needs.verify.result != 'success' || needs.release.result != 'success')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Open draft pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  OLD: ${{ needs.bump.outputs.old }}
                  NEW: ${{ needs.bump.outputs.new }}
                  BRANCH: ${{ needs.bump.outputs.branch }}
                  VERIFY: ${{ needs.verify.result }}
                  RELEASE: ${{ needs.release.result }}
              run: |
                  set -euo pipefail
                  cat > body.md <<BODY
                  Automated bump of the official Filen SDK: \`${OLD}\` -> \`${NEW}\`.

                  Not merged automatically (verify: **${VERIFY}**, release: **${RELEASE}**; auto-merge can also be
                  disabled with the repository variable FILEN_AUTO_MERGE=false). See the failed run for details.
                  Upstream diff: https://github.com/FilenCloudDienste/filen-rs/compare/${OLD}...${NEW}
                  BODY
                  gh pr create --draft --base main --head "$BRANCH" \
                      --title "Update Filen SDK to ${NEW}" --body-file body.md
